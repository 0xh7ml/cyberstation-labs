[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

# One-shot: install the loopback firewall rule before OliveTin serves.
# Idempotent, safe across `docker compose restart target`.
[program:firewall]
command=/usr/local/bin/init-firewall.sh
autorestart=false
startsecs=0
priority=1
stdout_logfile=/var/log/supervisor/firewall.log
stderr_logfile=/var/log/supervisor/firewall.log

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/sshd.log
stderr_logfile=/var/log/supervisor/sshd.log

[program:apache]
command=/usr/local/bin/apache2-foreground.real
autorestart=true
stopsignal=WINCH
priority=20
stdout_logfile=/var/log/supervisor/apache.log
stderr_logfile=/var/log/supervisor/apache.log

# Runs as root (no user= override): the Backup-Database command-injection
# primitive therefore executes as root -> the one intended root path.
[program:olivetin]
command=/usr/local/bin/OliveTin -configdir /config
directory=/usr/local/bin
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/olivetin.log
stderr_logfile=/var/log/supervisor/olivetin.log
