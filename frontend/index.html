<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureBank Labs</title>
    <!-- Bootstrap 5 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- highlight.js default dark theme -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    />
    <style>
      :root {
        --brand-red: #dc3545;
        --sidebar-bg: #1e2330;
        --sidebar-text: #c2c7d0;
        --sidebar-hover: #2d3446;
        --sidebar-active: #dc3545;
        --code-bg: #1e2330;
      }
      body {
        background-color: #f4f6f9;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wrapper {
        display: flex;
        min-height: 100vh;
      }
      /* Sidebar */
      .main-sidebar {
        width: 260px;
        min-height: 100vh;
        background-color: var(--sidebar-bg);
        color: var(--sidebar-text);
        flex-shrink: 0;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        overflow-y: auto;
        z-index: 1000;
        transition: width 0.3s ease;
      }
      .brand-link {
        display: flex;
        align-items: center;
        padding: 1rem 1.25rem;
        background-color: rgba(0,0,0,0.2);
        text-decoration: none;
        border-bottom: 1px solid rgba(255,255,255,0.1);
      }
      .brand-link .brand-text {
        color: #fff;
        font-weight: 700;
        font-size: 1rem;
        margin-left: 0.6rem;
        letter-spacing: 0.03em;
      }
      .nav-sidebar .nav-item {
        list-style: none;
      }
      .nav-sidebar .nav-link {
        color: var(--sidebar-text);
        padding: 0.5rem 1rem;
        border-radius: 4px;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        font-size: 0.875rem;
      }
      .nav-sidebar .nav-link:hover {
        background-color: var(--sidebar-hover);
        color: #fff;
      }
      .nav-sidebar .nav-link.active {
        background-color: var(--sidebar-active);
        color: #fff;
      }
      .nav-sidebar .nav-header {
        color: #6c757d;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 1rem 1rem 0.3rem;
      }
      /* Content area */
      .content-wrapper {
        margin-left: 260px;
        flex: 1;
        min-height: 100vh;
      }
      /* Code blocks */
      pre code.hljs {
        border-radius: 6px;
        font-size: 0.82rem;
      }
      .code-before { border-left: 4px solid #dc3545; }
      .code-after  { border-left: 4px solid #198754; }
      /* Difficulty badges */
      .badge-low    { background-color: #198754; }
      .badge-medium { background-color: #ffc107; color: #000; }
      .badge-high   { background-color: #dc3545; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Bootstrap 5 JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQMzFBQ"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
