events {
    worker_connections 1024;
}

http {
    upstream flask {
        server flask-app:5000;
    }
    upstream django {
        server django-app:8000;
    }
    upstream go_report {
        server go-report-svc:8080;
    }
    upstream frontend {
        server frontend:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Flask API — A01, A04, A05, A07, A08, A10
        location /api/flask/ {
            proxy_pass http://flask/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Django API — A02, A06
        location /api/django/ {
            proxy_pass http://django/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Django admin panel — A02 Lab 05
        location /admin/ {
            proxy_pass http://django/admin/;
            proxy_set_header Host $host;
        }

        # Sensitive file exposure — A02 Lab 06
        location ~ ^/(\.env|\.git.*|backup\.zip) {
            proxy_pass http://django$uri;
            proxy_set_header Host $host;
        }

        # Go Echo report microservice — A05 Lab 12
        location /api/report/ {
            proxy_pass http://go_report/;
            proxy_set_header Host $host;
        }

        # React frontend (everything else)
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
